apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mycotrack-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: mycotrack-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mycotrack-frontend-service
            port:
              number: 80
