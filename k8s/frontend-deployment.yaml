apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycotrack-frontend
  namespace: default
  labels:
    app: mycotrack-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mycotrack-frontend
  template:
    metadata:
      labels:
        app: mycotrack-frontend
    spec:
      containers:
      - name: frontend
        image: mycotrack-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: mycotrack-frontend-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: mycotrack-frontend
